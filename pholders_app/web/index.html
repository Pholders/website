<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pholders_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pholders_app</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Cutting the background out of a doctor's profile photo.

    This runs in the browser, on the machine of whoever is uploading, because
    it cannot run on our server: one removal peaks at about 1GB of memory and
    the API container has 512MB, so the process was being killed part-way
    through every upload and taking the whole API down with it.

    Loaded as a module and resolved lazily, so a slow or unreachable CDN
    delays nothing at startup. The Flutter side treats a missing or failed
    remover as "upload the photo as it is", so the worst case is a photo with
    its background still on rather than a failed upload.
  -->
  <script type="module">
    let loader = null;

    /**
     * Shrinks a photo so its longest edge is at most maxEdge, and returns it
     * as a JPEG blob. Smaller photos are handed back untouched.
     *
     * A cut-out comes back as PNG, which is lossless, so a phone photo of
     * 2688x4032 turns into twenty or thirty megabytes - past the server's
     * 5MB limit, even though the JPEG that went in was only a few. Shrinking
     * first keeps the result small and makes the model faster, and a profile
     * picture is displayed a couple of hundred pixels wide anyway.
     *
     * createImageBitmap is told to honour EXIF orientation, or photos taken
     * in portrait arrive on their side.
     */
    async function shrink(blob, maxEdge) {
      const bitmap = await createImageBitmap(blob, { imageOrientation: 'from-image' });
      const longest = Math.max(bitmap.width, bitmap.height);
      if (longest <= maxEdge) return blob;

      const scale = maxEdge / longest;
      const width = Math.max(1, Math.round(bitmap.width * scale));
      const height = Math.max(1, Math.round(bitmap.height * scale));

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
      bitmap.close();

      return new Promise((resolve) =>
        canvas.toBlob((out) => resolve(out || blob), 'image/jpeg', 0.92));
    }

    window.pholdersRemoveBackground = async function (bytes, mimeType, maxEdge) {
      if (!loader) {
        // Pinned, and to a version the registry actually lists — an exact
        // version that does not exist fails silently here, and the photo
        // just keeps its background with nothing to say why.
        loader = import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.8/+esm');
      }
      const { removeBackground } = await loader;
      const source = await shrink(new Blob([bytes], { type: mimeType }), maxEdge || 1024);
      const blob = await removeBackground(source, {
        model: 'small',
        output: { format: 'image/png' },
      });
      return new Uint8Array(await blob.arrayBuffer());
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.

</body>
</html>
