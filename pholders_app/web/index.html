<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pholders_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pholders_app</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Cutting the background out of a doctor's profile photo.

    This runs in the browser, on the machine of whoever is uploading, because
    it cannot run on our server: one removal peaks at about 1GB of memory and
    the API container has 512MB, so the process was being killed part-way
    through every upload and taking the whole API down with it.

    Loaded as a module and resolved lazily, so a slow or unreachable CDN
    delays nothing at startup. The Flutter side treats a missing or failed
    remover as "upload the photo as it is", so the worst case is a photo with
    its background still on rather than a failed upload.
  -->
  <script type="module">
    let loader = null;

    window.pholdersRemoveBackground = async function (bytes, mimeType) {
      if (!loader) {
        // Pinned, and to a version the registry actually lists — an exact
        // version that does not exist fails silently here, and the photo
        // just keeps its background with nothing to say why.
        loader = import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.8/+esm');
      }
      const { removeBackground } = await loader;
      const blob = await removeBackground(
        new Blob([bytes], { type: mimeType }),
        { model: 'small', output: { format: 'image/png' } },
      );
      return new Uint8Array(await blob.arrayBuffer());
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
